[tool.ruff]
# 行长度设置为120字符
line-length = 120

# 目标Python版本
target-version = "py310"

# 排除的文件和目录
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import排序)
    "N",      # pep8-naming (命名规范)
    "UP",     # pyupgrade (Python语法升级)
    "B",      # flake8-bugbear (常见bug检查)
    "C4",     # flake8-comprehensions (列表推导式优化)
    "SIM",    # flake8-simplify (代码简化建议)
    "RUF",    # Ruff-specific rules
]

# 忽略的规则
ignore = [
    "E501",   # 行长度过长（由formatter自动处理）
    "B008",   # 函数调用中的默认参数（在FastAPI等框架中常见）
]

# 允许自动修复的规则
fixable = ["ALL"]
unfixable = []

# 每个文件允许的未使用导入数量
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# import排序配置
known-first-party = ["GPT_SoVITS"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
# 强制单行导入
force-single-line = false
# 使用括号包裹多行导入
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
# 使用双引号
quote-style = "double"

# 缩进样式：空格
indent-style = "space"

# 行尾处理：自动检测
line-ending = "auto"

# 尾随逗号
skip-magic-trailing-comma = false

[tool.ruff.lint.pep8-naming]
# 允许的类命名模式
classmethod-decorators = ["classmethod"]
