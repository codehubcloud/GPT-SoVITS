ci:
  autoupdate_schedule: monthly

repos:
# Ruff - 快速Python linter和formatter
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.7
  hooks:
    # Linter - 代码检查
    - id: ruff
      types_or: [python, pyi]
      args: [--fix, --exit-non-zero-on-fix]
    # Formatter - 代码格式化
    - id: ruff-format
      types_or: [python, pyi]

# 基础文件检查
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: trailing-whitespace       # 删除行尾空格
      exclude: ^.*\.(md|rst)$
    - id: end-of-file-fixer         # 确保文件以换行符结尾
    - id: check-yaml                # 检查YAML文件语法
    - id: check-json                # 检查JSON文件语法
    - id: check-added-large-files   # 防止提交大文件
      args: [--maxkb=2000]
    - id: check-merge-conflict      # 检查合并冲突标记
    - id: mixed-line-ending         # 检查混合的行尾符
      args: [--fix=lf]
